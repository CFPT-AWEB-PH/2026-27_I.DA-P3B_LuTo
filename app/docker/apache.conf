# ---------------------------------------------------------------------------
# Hôte virtuel de l'application : TOUT est refusé par défaut, puis on autorise
# uniquement ce qui doit être public (pages .php et dossier assets/).
# Le dossier du projet est monté dans le conteneur : sans ces règles, .env,
# les scripts SQL, les sauvegardes, etc. seraient téléchargeables.
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    # Pas de listing de dossier, pas de .htaccess (la configuration est ici)
    <Directory /var/www/html>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all denied

        # Seuls les scripts PHP de l'application sont exécutables/accessibles
        <FilesMatch "\.php$">
            Require all granted
        </FilesMatch>
    </Directory>

    # Fichiers statiques publics (CSS, JS, polices)
    <Directory /var/www/html/assets>
        Require all granted
        <FilesMatch "\.(php|phtml|phar|pl|py|cgi|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Racine du site et index des sous-dossiers publics
    <LocationMatch "^/(admin/|arbitrage/)?$">
        Require all granted
    </LocationMatch>

    # PWA : le Service Worker doit être servi à la racine pour contrôler toute
    # l'application. Jamais mis en cache par le navigateur (mises à jour immédiates).
    <LocationMatch "/sw\.js$">
        Require all granted
        Header set Cache-Control "no-cache"
    </LocationMatch>
    AddType application/manifest+json .webmanifest
    <LocationMatch "\.webmanifest$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    # Dossiers et fichiers internes : jamais servis, même les .php
    # (appliqué après les règles <Directory>/<Files>, donc prioritaire)
    <LocationMatch "(?i)^/(includes|config|sql|docker|tests|ble_receiver|raspberry|telecommandes|_backup[^/]*|\.git|vendor)(/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "(?i)(^|/)\.|\.(env|md|ya?ml|sql|py|sh|ini|log|bak|old|orig|swp|dist|example|lock|json)$|/(Dockerfile|docker-compose[^/]*|install\.sh|_[^/]*\.php)$">
        Require all denied
    </LocationMatch>

    # Seules les méthodes utilisées par l'application sont acceptées
    # (<If> ne s'applique qu'aux autres méthodes : il ne remplace pas les règles ci-dessus)
    <If "%{REQUEST_METHOD} !~ /^(GET|POST|HEAD)$/">
        Require all denied
    </If>

    # Taille maximale d'une requête (import CSV compris) : 4 Mo
    LimitRequestBody 4194304

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
