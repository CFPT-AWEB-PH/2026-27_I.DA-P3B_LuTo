services:

  db:
    image: mariadb:11
    container_name: sabre_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE:      ${DB_NAME:-sabre_arbitrage}
      MARIADB_USER:          ${DB_USER:-arbitrage_user}
      MARIADB_PASSWORD:      ${DB_PASS:-arbitrage_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: sabre_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-sabre_arbitrage}
      DB_USER: ${DB_USER:-arbitrage_user}
      DB_PASS: ${DB_PASS:-arbitrage_pass}
      BASE_URL: ${BASE_URL:-/}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Hot-reload du code en dev (commenter en prod)
      - .:/var/www/html

volumes:
  db_data:
