[www]
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500
; transmettre les variables d'environnement du conteneur à PHP
clear_env = no
ping.path = /ping
catch_workers_output = yes
decorate_workers_output = no
; les accès sont journalisés par Caddy
access.log = /dev/null
